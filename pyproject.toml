[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vastly"
dynamic = ["version"]
description = "Connect to Vast.ai GPU instances -- sync SSH configs, set up your project, and open your IDE."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Seamus Fallows" }]
keywords = ["vast.ai", "gpu", "ssh", "remote-development"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.urls]
Repository = "https://github.com/seamus-fallows/vastly"
Issues = "https://github.com/seamus-fallows/vastly/issues"

[project.scripts]
vst = "vastly.cli:main"
vastly = "vastly.cli:main"

[tool.hatch.version]
path = "src/vastly/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/vastly"]

[tool.pytest.ini_options]
